const results=[];
function test(name,fn){try{fn();results.push('PASS '+name);}catch(e){results.push('FAIL '+name+': '+e.message);}}
function assert(v,m='Warunek niespełniony'){if(!v)throw Error(m);}
function frames(w,n,input={}){for(let i=0;i<n;i++)w.step(1/120,input);}
function climbRoute(w,shelf){
  const build=(target,seen=new Set())=>{
    assert(!seen.has(target),'Cykl drogi do podestu');seen.add(target);
    const l=w.ladders.find(l=>!l.to&&l.top===target.y&&l.x>=target.x&&l.x<=target.x+target.w);
    assert(l,'Brak drogi do podestu '+w.realmId);
    if(l.bottom===450)return [l];
    const base=w.platforms.find(p=>p.y===l.bottom&&l.x>=p.x&&l.x<=p.x+p.w);
    assert(base,'Brak podstawy drabiny');return [...build(base,seen),l];
  };
  const route=build(shelf);Object.assign(w.p,{x:route[0].x-11,y:414,vx:0,vy:0});frames(w,2);
  for(const l of route){
    for(let i=0;i<300&&Math.abs(w.p.x+11-l.x)>2;i++)frames(w,1,{right:w.p.x+11<l.x,left:w.p.x+11>l.x});
    frames(w,15);
    for(let i=0;i<450&&!(w.p.ground&&Math.abs(w.p.y+36-l.top)<.1);i++)frames(w,1,{up:true});
    frames(w,1);assert(w.p.ground&&Math.abs(w.p.y+36-l.top)<.1,'Nieosiągalny podest '+w.realmId+' x='+l.x);
  }
}
function collect(w,item){
  const shelf=w.platforms.find(p=>p.h===18&&item.x>=p.x&&item.x+item.w<=p.x+p.w&&Math.abs(item.y+item.h-p.y)<15);
  assert(shelf,'Brak podestu dla '+item.id);climbRoute(w,shelf);
  for(let i=0;i<200&&!item.taken;i++)frames(w,1,{right:item.x>w.p.x,left:item.x<w.p.x});
  assert(item.taken,'Nieosiągalny przedmiot '+item.id);assert(w.deaths===0,'Pułapka blokuje przedmiot '+item.id);
}

// Exercise each complete ground route using the real movement/jump simulation.
for(const def of Object.values(ZD.realms))test('Trasa piesza '+def.id,()=>{
 const w=new ZD.World();w.enterRealm(def.id,{x:40,y:414});let jump=false;
 for(let i=0;i<2600&&w.p.x<520;i++){
   const p=w.p,edge=p.x+p.w,ground=w.platforms.find(s=>Math.abs(s.y-p.y-p.h)<1&&edge>s.x&&p.x<s.x+s.w);
   const obstacle=w.patrols.some(e=>e.x-edge>-6&&e.x-edge<43);
   const wait=w.barriers.some(b=>edge>b.x-42&&edge<b.x&& (b.active||b.warning));
   if(p.ground)jump=!!(ground&&edge>ground.x+ground.w-40)||obstacle;else if(p.vy>0)jump=false;
   const before=[Math.round(p.x),Math.round(p.y),Math.round(p.vy),Math.round(p.vx),w.roomTime.toFixed(2),wait,w.barriers.map(b=>[b.active,b.warning])];w.step(1/120,{right:!wait,jump});
   assert(w.deaths===0,'Porażka x,y,vy='+before+' przeciwnik='+w.patrols.map(e=>Math.round(e.x))); 
 }
 assert(w.p.x>=520,'Nieprzejezdna trasa');
});

  for(let i=0;i<2600&&w.p.x>40;i++){
   const p=w.p,ground=w.platforms.find(s=>Math.abs(s.y-p.y-p.h)<1&&p.x+p.w>s.x&&p.x<s.x+s.w);
   const obstacle=w.patrols.some(e=>p.x-e.x-e.w>-6&&p.x-e.x-e.w<43);
   const wait=w.barriers.some(b=>p.x<b.x+b.w+42&&p.x>b.x+b.w&&(b.active||b.warning));
   if(p.ground)jump=!!(ground&&p.x<ground.x+40)||obstacle;else if(p.vy>0)jump=false;
   const before=Math.round(p.x);w.step(1/120,{left:!wait,jump});assert(!w.deaths,'Powrót '+def.id+' x='+before);
  }assert(w.p.x<=40,'Brak powrotu '+def.id);
 }
